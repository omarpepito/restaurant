service: restaurant-backend
frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  stage: dev
  region: us-east-1

plugins:
  - serverless-plugin-typescript
  - serverless-offline

functions:
  # Products
  createProduct:
    handler: src/handlers/productHandler.create
    events:
      - http:
          path: products
          method: post
  getProducts:
    handler: src/handlers/productHandler.get
    events:
      - http:
          path: products
          method: get

  # Cart
  addToCart:
    handler: src/handlers/cartHandler.add
    events:
      - http:
          path: cart
          method: post
  getCart:
    handler: src/handlers/cartHandler.get
    events:
      - http:
          path: cart/{userId}
          method: get
  updateCartItem:
    handler: src/handlers/cartHandler.update
    events:
      - http:
          path: cart/{userId}/item/{itemId}
          method: put
  removeCartItem:
    handler: src/handlers/cartHandler.remove
    events:
      - http:
          path: cart/{userId}/item/{itemId}
          method: delete

  # Orders
  checkoutOrder:
    handler: src/handlers/orderHandler.checkout
    events:
      - http:
          path: orders
          method: post
  getOrder:
    handler: src/handlers/orderHandler.get
    events:
      - http:
          path: orders/{orderId}
          method: get
  listOrdersByUser:
    handler: src/handlers/orderHandler.listByUser
    events:
      - http:
          path: orders/user/{userId}
          method: get
  getOrderTimeline:
    handler: src/handlers/orderHandler.timeline
    events:
      - http:
          path: orders/{orderId}/timeline
          method: get
custom:
  dynamodb:
    start:
      port: 8000
      inMemory: true
      migrate: true
    stages:
      - dev

resources:
  Resources:
    ProductsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Products
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST

    OrdersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Orders
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: UserIdIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    OrderEventsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: OrderEvents
        AttributeDefinitions:
          - AttributeName: eventId
            AttributeType: S
          - AttributeName: orderId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: eventId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OrderIdTimestampIndex
            KeySchema:
              - AttributeName: orderId
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST
